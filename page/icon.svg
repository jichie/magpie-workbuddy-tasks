<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WorkBuddy 任务">
  <!-- 平面双色调：深底浅线（浅色/深色主题下都清晰），无渐变、无阴影，对齐 magpie 的克制风格。
       图形：猫头轮廓（耳朵）+ 内部对勾 = 「猫猫任务批量完成」。 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111112"/>
  <g fill="none" stroke="#fafafa" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左耳 -->
    <path d="M21.5 23.5 L18.5 11.5 L29.5 18.5"/>
    <!-- 右耳 -->
    <path d="M42.5 23.5 L45.5 11.5 L34.5 18.5"/>
    <!-- 头 -->
    <rect x="14" y="20" width="36" height="31" rx="12"/>
    <!-- 对勾 -->
    <path d="M23.5 36.5 L29.5 42.5 L41 29.5"/>
  </g>
</svg>
